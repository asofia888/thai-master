<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4efe4">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17120d">
<title>タイ語マスター — เรียนภาษาไทย</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タイ語マスター">
<meta name="description" content="日本語話者のためのタイ語学習PWA。初級・中級・上級コースをSRSで効率学習。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#f4efe4;--bg-card:#fdfaf3;--bg-sub:#faf5ea;
    --ink:#1a1410;--ink-soft:#5a4f42;--ink-muted:#7a6e5d;--ink-faint:#b5a78f;
    --line:#e2d8c2;--line-soft:#ecdfc8;
    --accent:#a8391a;--accent-warm:#c86432;--accent-soft:rgba(168,57,26,0.08);
    --accent-fill:#a8391a;--green-fill:#5a7a3a;
    --ok-bg:rgba(90,122,58,0.08);--ng-bg:rgba(168,57,26,0.06);
    --gold:#b8955a;--gold-soft:#d9c89a;--green:#5a7a3a;
    --shadow-sm:0 1px 2px rgba(26,20,16,0.04);
    --shadow-md:0 1px 2px rgba(26,20,16,0.03),0 4px 16px rgba(26,20,16,0.04);
    --shadow-lg:0 2px 4px rgba(26,20,16,0.04),0 12px 32px rgba(26,20,16,0.06);
  }
  /* --accent / --green は前景(文字)用、--accent-fill / --green-fill は白文字を載せる塗り用。
     ダークモードでは前景を明るく・塗りは暗めに保ってコントラストを両立させる。 */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17120d;--bg-card:#201a14;--bg-sub:#282017;
      --ink:#ece3d2;--ink-soft:#c6b9a2;--ink-muted:#a3957e;--ink-faint:#6e6250;
      --line:#3a3126;--line-soft:#322a20;
      --accent:#e0764e;--accent-warm:#e6976a;--accent-soft:rgba(224,118,78,0.12);
      --accent-fill:#9c3517;--green-fill:#4a6330;
      --ok-bg:rgba(147,181,110,0.14);--ng-bg:rgba(224,118,78,0.12);
      --gold:#cfa76a;--gold-soft:#8a7449;--green:#93b56e;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.25);
      --shadow-md:0 1px 2px rgba(0,0,0,0.2),0 4px 16px rgba(0,0,0,0.25);
      --shadow-lg:0 2px 4px rgba(0,0,0,0.25),0 12px 32px rgba(0,0,0,0.35);
    }
    body::before{
      background-image:radial-gradient(circle at 20% 10%,rgba(207,167,106,0.05) 0%,transparent 40%),
        radial-gradient(circle at 85% 70%,rgba(224,118,78,0.04) 0%,transparent 45%);
    }
  }
  html{background:var(--bg);}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Noto Sans JP',sans-serif;line-height:1.5;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;max-width:480px;margin:0 auto;
    background-image:radial-gradient(circle at 20% 10%,rgba(184,149,90,0.04) 0%,transparent 40%),
      radial-gradient(circle at 85% 70%,rgba(168,57,26,0.03) 0%,transparent 45%);
    pointer-events:none;z-index:0;
  }
  .app{position:relative;z-index:1;}

  .screen{display:none;animation:fadeIn .35s ease;min-height:100vh;padding-bottom:80px;}
  .screen.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* TOP BAR */
  .top-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px 12px;background:var(--bg);
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .top-bar .left{display:flex;align-items:center;gap:10px;}
  .back-btn{
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    background:transparent;border:none;cursor:pointer;color:var(--ink);border-radius:50%;
    transition:background .2s;
  }
  .back-btn:active{background:var(--accent-soft);}
  .back-btn svg{width:16px;height:16px;}
  .top-title{font-family:'Shippori Mincho',serif;font-size:15px;font-weight:600;letter-spacing:.1em;}
  .top-title .thai{font-family:'Noto Serif Thai',serif;color:var(--accent);font-size:12.5px;margin-top:1px;display:block;letter-spacing:.05em;font-weight:500;}
  .top-meta{font-size:12.5px;color:var(--ink-muted);letter-spacing:.1em;}

  /* HOME */
  .home-header{padding:32px 24px 20px;text-align:center;}
  .home-header .mark{display:inline-flex;align-items:center;gap:10px;margin-bottom:14px;}
  .home-header .mark span{display:block;width:20px;height:1px;background:var(--gold);}
  .home-header .mark .thai-mini{font-family:'Noto Serif Thai',serif;font-weight:500;font-size:12.5px;color:var(--gold);letter-spacing:.25em;text-transform:uppercase;}
  .home-header h1{font-family:'Shippori Mincho',serif;font-weight:600;font-size:28px;letter-spacing:.1em;margin-bottom:8px;}
  .home-header .thai-title{font-family:'Noto Serif Thai',serif;font-weight:400;font-size:17px;color:var(--accent);letter-spacing:.05em;margin-bottom:10px;}
  .home-header .subtitle{font-size:12px;color:var(--ink-muted);letter-spacing:.3em;text-transform:uppercase;}

  .stats-bar{
    margin:4px 16px 24px;padding:16px 20px;background:var(--bg-card);
    border:1px solid var(--line);border-radius:6px;
    display:flex;justify-content:space-around;box-shadow:var(--shadow-sm);
  }
  .stat-item{text-align:center;}
  .stat-num{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:600;color:var(--accent);line-height:1;}
  .stat-label{font-size:12px;color:var(--ink-muted);letter-spacing:.15em;margin-top:6px;}

  .section-title{
    padding:8px 24px 14px;font-family:'Shippori Mincho',serif;
    font-size:14px;font-weight:600;letter-spacing:.2em;color:var(--ink);
    display:flex;align-items:center;gap:12px;
  }
  .section-title::before{content:'';width:16px;height:1px;background:var(--accent);}

  /* COURSE CARDS */
  .courses{padding:0 16px;}
  .course-card{
    display:block;width:100%;background:var(--bg-card);border:1px solid var(--line);
    border-radius:8px;padding:22px 22px 20px;margin-bottom:14px;text-align:left;cursor:pointer;
    box-shadow:var(--shadow-md);position:relative;overflow:hidden;
    transition:transform .2s,box-shadow .2s;
  }
  .course-card:active{transform:scale(.99);}
  .course-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--ribbon);
  }
  .course-card.script{--ribbon:linear-gradient(to right,#5a7a3a,#8aa860);}
  .course-card.beginner{--ribbon:linear-gradient(to right,#b8955a,#d9c89a);}
  .course-card.intermediate{--ribbon:linear-gradient(to right,#c86432,#e88e5a);}
  .course-card.advanced{--ribbon:linear-gradient(to right,#a8391a,#6b2010);}

  .course-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
  .course-level{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:600;letter-spacing:.1em;}
  .course-thai{font-family:'Noto Serif Thai',serif;font-size:15px;color:var(--accent);margin-top:4px;font-weight:500;}
  .course-num{font-family:'Shippori Mincho',serif;font-size:12.5px;color:var(--gold);letter-spacing:.2em;}
  .course-desc{font-size:14px;color:var(--ink-soft);margin-bottom:16px;letter-spacing:.04em;}

  .progress-row{display:flex;align-items:center;gap:12px;}
  .progress-track{flex:1;height:4px;background:var(--line-soft);border-radius:2px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease;}
  .progress-text{font-size:12.5px;color:var(--ink-soft);letter-spacing:.05em;font-variant-numeric:tabular-nums;min-width:56px;text-align:right;}

  /* UNIT LIST */
  .course-banner{padding:24px 24px 20px;text-align:center;border-bottom:1px solid var(--line);margin-bottom:8px;}
  .course-banner .label{font-size:12px;letter-spacing:.3em;color:var(--gold);margin-bottom:8px;text-transform:uppercase;}
  .course-banner h2{font-family:'Shippori Mincho',serif;font-size:24px;font-weight:600;letter-spacing:.12em;margin-bottom:6px;}
  .course-banner .thai{font-family:'Noto Serif Thai',serif;color:var(--accent);font-size:15px;margin-bottom:10px;}

  .units{padding:12px 16px;}
  .unit-card{
    display:flex;align-items:center;width:100%;background:var(--bg-card);
    border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:10px;
    cursor:pointer;text-align:left;box-shadow:var(--shadow-sm);
    transition:transform .15s,box-shadow .2s;
  }
  .unit-card:active{transform:scale(.99);}
  .unit-num{font-family:'Shippori Mincho',serif;font-size:15px;color:var(--gold);font-weight:500;letter-spacing:.12em;min-width:36px;}
  .unit-info{flex:1;}
  .unit-title{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:600;letter-spacing:.06em;margin-bottom:3px;}
  .unit-thai{font-family:'Noto Serif Thai',serif;font-size:13px;color:var(--accent);}
  .unit-meta{text-align:right;margin-left:12px;}
  .unit-count{font-size:12px;color:var(--ink-muted);letter-spacing:.1em;font-variant-numeric:tabular-nums;}
  .unit-progress{width:36px;height:3px;background:var(--line-soft);border-radius:2px;margin-top:6px;overflow:hidden;}
  .unit-progress-fill{height:100%;background:var(--accent);transition:width .3s;}
  .unit-progress-fill.complete{background:var(--green);}

  /* STUDY */
  .study-controls{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--line);
    position:sticky;top:49px;z-index:40;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .mode-tabs{display:flex;gap:0;background:var(--bg-sub);border-radius:4px;padding:2px;}
  .mode-tab{
    padding:6px 12px;font-size:12.5px;font-weight:500;letter-spacing:.1em;color:var(--ink-muted);
    background:transparent;border:none;cursor:pointer;border-radius:3px;transition:all .2s;
  }
  .mode-tab.active{background:var(--bg-card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .study-counter{font-family:'Shippori Mincho',serif;font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums;letter-spacing:.1em;}

  /* SENTENCE LIST */
  .sentence-list{padding:14px 16px 24px;}
  .sentence-card{
    background:var(--bg-card);border:1px solid var(--line);border-radius:8px;
    padding:20px 18px 18px;margin-bottom:14px;box-shadow:var(--shadow-sm);position:relative;
    animation:fadeUp .3s ease both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .sentence-card .num{position:absolute;top:14px;right:18px;font-family:'Shippori Mincho',serif;font-size:12px;color:var(--gold);letter-spacing:.15em;}

  .sent-thai{
    font-family:'Noto Sans Thai',sans-serif;font-weight:600;font-size:24px;line-height:1.5;color:var(--ink);
    cursor:pointer;display:inline-block;padding:4px 8px;border-radius:6px;
    transition:background .2s,color .2s;user-select:none;-webkit-user-select:none;
    margin-bottom:8px;margin-left:-8px;
  }
  .sent-thai:active,.sent-thai.playing{background:var(--accent-soft);color:var(--accent);}
  .sent-thai .speaker-icon{display:inline-block;width:14px;height:14px;margin-left:8px;opacity:.4;vertical-align:middle;transition:opacity .2s;}
  .sent-thai.playing .speaker-icon{opacity:1;}

  .sent-ph{
    font-family:'Inter',sans-serif;font-size:15px;color:var(--ink-soft);
    letter-spacing:.02em;margin-bottom:8px;font-style:italic;
  }
  .sent-jp{
    font-family:'Shippori Mincho',serif;font-size:16px;font-weight:500;color:var(--ink);
    letter-spacing:.05em;padding-bottom:14px;border-bottom:1px dashed var(--line-soft);
  }

  .sent-actions{display:flex;gap:8px;margin-top:12px;align-items:center;}
  .icon-btn{
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    background:transparent;border:1px solid var(--line);border-radius:4px;cursor:pointer;
    color:var(--ink-soft);transition:all .15s;flex-shrink:0;
  }
  .icon-btn:active{transform:scale(.95);}
  .icon-btn svg{width:14px;height:14px;}
  .icon-btn.slow{color:var(--gold);}
  .icon-btn.learned{background:var(--bg-sub);}
  .icon-btn.learned.active{background:var(--green-fill);color:#fff;border-color:var(--green-fill);}

  .vocab-toggle{
    flex:1;text-align:left;padding:8px 12px;font-size:12.5px;font-weight:500;
    background:var(--bg-sub);border:1px solid var(--line);border-radius:4px;color:var(--ink-soft);
    cursor:pointer;letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between;
  }
  .vocab-toggle.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
  .vocab-toggle .arrow{font-size:12px;transition:transform .2s;}
  .vocab-toggle.active .arrow{transform:rotate(90deg);}

  .vocab-list{
    margin-top:12px;padding:14px 14px 4px;background:var(--bg-sub);border-radius:6px;
    display:none;animation:fadeIn .25s ease;
  }
  .vocab-list.show{display:block;}
  .vocab-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 4px;border-bottom:1px solid var(--line-soft);gap:12px;
  }
  .vocab-item:last-child{border-bottom:none;}
  .vocab-th{
    font-family:'Noto Sans Thai',sans-serif;font-weight:600;font-size:17px;color:var(--ink);
    cursor:pointer;padding:2px 4px;border-radius:3px;transition:background .2s;flex-shrink:0;
  }
  .vocab-th:active,.vocab-th.playing{background:var(--accent-soft);color:var(--accent);}
  .vocab-ph{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--ink-muted);letter-spacing:.02em;flex:1;text-align:center;}
  .vocab-jp{font-family:'Shippori Mincho',serif;font-size:14px;color:var(--ink);text-align:right;flex-shrink:0;max-width:120px;}

  /* CARD MODE */
  .card-area{padding:24px 20px;min-height:calc(100vh - 220px);display:flex;flex-direction:column;}
  .flashcard{
    flex:1;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;
    padding:32px 22px;box-shadow:var(--shadow-lg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    cursor:pointer;position:relative;min-height:380px;
  }
  .fc-num{position:absolute;top:18px;left:22px;font-family:'Shippori Mincho',serif;font-size:12.5px;color:var(--gold);letter-spacing:.2em;}
  .fc-side{position:absolute;top:18px;right:22px;font-size:11px;color:var(--ink-faint);letter-spacing:.25em;text-transform:uppercase;}

  .fc-thai{
    font-family:'Noto Sans Thai',sans-serif;font-weight:600;font-size:26px;line-height:1.5;color:var(--ink);
    margin-bottom:16px;cursor:pointer;padding:6px 10px;border-radius:6px;transition:background .2s;
  }
  .fc-thai.playing{background:var(--accent-soft);color:var(--accent);}
  .fc-ph{font-family:'Inter',sans-serif;font-size:15px;color:var(--ink-soft);letter-spacing:.02em;margin-bottom:24px;font-style:italic;}
  .fc-jp{font-family:'Shippori Mincho',serif;font-size:19px;font-weight:600;color:var(--accent);letter-spacing:.06em;line-height:1.5;transition:opacity .3s,filter .3s;}
  .fc-hint{margin-top:24px;font-size:12px;color:var(--ink-muted);letter-spacing:.25em;text-transform:uppercase;}
  .fc-hidden{opacity:.15;filter:blur(6px);user-select:none;}

  .fc-controls{display:flex;gap:12px;margin-top:20px;}
  .fc-btn{
    flex:1;padding:14px;font-family:'Shippori Mincho',serif;font-size:14px;font-weight:500;letter-spacing:.15em;
    background:var(--bg-card);border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--ink);
    display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;
  }
  .fc-btn:active{transform:scale(.97);}
  .fc-btn svg{width:14px;height:14px;}
  .fc-btn.prev{color:var(--ink-soft);}
  .fc-btn.next{background:var(--ink);color:var(--bg-card);border-color:var(--ink);}

  /* QUIZ */
  .quiz-area{padding:20px 20px 40px;}
  .quiz-progress{display:flex;gap:4px;margin-bottom:24px;}
  .quiz-progress .pip{flex:1;height:3px;background:var(--line-soft);border-radius:2px;transition:background .3s;}
  .quiz-progress .pip.done{background:var(--green);}
  .quiz-progress .pip.wrong{background:var(--accent);}
  .quiz-progress .pip.current{background:var(--gold);}

  .quiz-question{
    text-align:center;margin-bottom:24px;padding:28px 18px;
    background:var(--bg-card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-md);
  }
  .quiz-prompt{font-size:12px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:14px;}
  .quiz-thai{
    font-family:'Noto Sans Thai',sans-serif;font-weight:600;font-size:22px;line-height:1.5;
    margin-bottom:8px;cursor:pointer;display:inline-block;padding:4px 10px;border-radius:4px;transition:background .2s;
  }
  .quiz-thai.playing{background:var(--accent-soft);color:var(--accent);}
  .quiz-ph-small{font-family:'Inter',sans-serif;font-size:13px;color:var(--ink-muted);letter-spacing:.02em;margin-top:4px;font-style:italic;}
  .quiz-jp{font-family:'Shippori Mincho',serif;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:.06em;line-height:1.4;}

  .quiz-options{display:flex;flex-direction:column;gap:10px;}
  .quiz-option{
    background:var(--bg-card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;
    cursor:pointer;text-align:left;transition:all .15s;position:relative;
  }
  .quiz-option:active{transform:scale(.99);}
  .quiz-option .opt-thai{font-family:'Noto Sans Thai',sans-serif;font-weight:500;font-size:17px;color:var(--ink);margin-bottom:2px;line-height:1.4;}
  .quiz-option .opt-jp{font-family:'Shippori Mincho',serif;font-size:14px;font-weight:500;color:var(--ink);line-height:1.4;}
  .quiz-option .opt-ph{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--ink-muted);letter-spacing:.02em;margin-top:2px;font-style:italic;}
  .quiz-option.correct{background:var(--ok-bg);border-color:var(--green);}
  .quiz-option.correct::after{content:'✓';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--green);font-size:19px;font-weight:bold;}
  .quiz-option.wrong{background:var(--ng-bg);border-color:var(--accent);}
  .quiz-option.wrong::after{content:'×';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:22px;}
  .quiz-option.disabled{pointer-events:none;}

  .quiz-next-btn{
    margin-top:18px;width:100%;padding:14px;font-family:'Shippori Mincho',serif;
    font-size:14px;font-weight:500;letter-spacing:.2em;
    background:var(--ink);color:var(--bg-card);border:none;border-radius:6px;cursor:pointer;display:none;
  }
  .quiz-next-btn.show{display:block;animation:fadeIn .25s;}
  .quiz-next-btn:active{transform:scale(.99);}

  .quiz-result{text-align:center;padding:40px 24px;}
  .quiz-result-emoji{font-family:'Noto Serif Thai',serif;font-size:32px;color:var(--gold);margin-bottom:16px;}
  .quiz-result-title{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:600;margin-bottom:8px;letter-spacing:.1em;}
  .quiz-result-thai{font-family:'Noto Serif Thai',serif;color:var(--accent);font-size:15px;margin-bottom:28px;}

    flex:1;padding:14px;font-family:'Shippori Mincho',serif;font-size:13px;font-weight:500;letter-spacing:.15em;
    border-radius:4px;cursor:pointer;transition:all .15s;

  .quiz-result-actions .retry{background:transparent;border:1px solid var(--ink);color:var(--ink);}
  .quiz-result-actions .next{background:var(--ink);border:1px solid var(--ink);color:var(--bg-card);}

  .fc-grade-btn .interval{font-size:11px;color:var(--ink-muted);letter-spacing:.05em;font-variant-numeric:tabular-nums;}

  .fc-grade-btn.easy{color:var(--green);border-color:var(--green);}
  .fc-grade-btn.easy .interval{color:var(--green);opacity:.7;}

  /* SRS — due badge on unit cards */
  .due-badge{
    display:inline-block;font-size:11px;color:#fff;background:var(--accent-fill);
    padding:2px 6px;border-radius:8px;margin-top:5px;font-variant-numeric:tabular-nums;

  /* Global review CTA on home */

    display:flex;align-items:center;justify-content:space-between;
    width:calc(100% - 32px);margin:-8px 16px 24px;padding:16px 20px;
    background:var(--accent-fill);color:#fff;border:none;border-radius:6px;cursor:pointer;
    box-shadow:var(--shadow-md);transition:transform .15s,opacity .2s;

  .review-cta:active{transform:scale(.98);}
  .review-cta .label{font-family:'Shippori Mincho',serif;font-size:15px;font-weight:600;letter-spacing:.12em;display:flex;align-items:center;gap:10px;}
  .review-cta .label svg{width:16px;height:16px;}
  .review-cta .count{font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:.1em;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:10px;font-variant-numeric:tabular-nums;}

  /* Data export / import */

    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .2s;

  /* Completion / empty screen — shared by cardComplete & review-empty */

    text-align:center;padding:40px 24px;

<script>
'use strict';
let COURSES = {};
const COURSES_URL = './courses.json';
const state = {course:null, unit:null, mode:'list', cardIdx:0, cardFlipped:false, completed:false, quiz:null, reviewQueue:null, globalQueue:null};

// DOM shorthand
const $  = (id) => document.getElementById(id);
const $$ = (sel, root) => (root||document).querySelectorAll(sel);

// SVG icons (centralised so they don't drift)
const ICONS = {
  back:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>',
  forward: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>',
  clock:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  check:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
  speaker: '<svg class="speaker-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>',
  speakerLg: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>'
};

async function loadCourses(){
  // force-cacheは使わない: HTTPキャッシュの古い内容が固定化され、コース更新が届かなくなる。
  // 速度はSWのstale-while-revalidateが担保する。
  const res = await fetch(COURSES_URL);
  if(!res.ok) throw new Error('courses.json: '+res.status);
  COURSES = await res.json();
}

// STORAGE
const STORAGE_KEY = 'thai_master_v2_progress';
function loadProgress(){
  try{
    const r=localStorage.getItem(STORAGE_KEY);
    const p=r?JSON.parse(r):{};
    if(!p.learned) p.learned={};
    if(!p.srs) p.srs={};
    if(!p.days) p.days={};
    return p;
  }catch{return{learned:{},srs:{},days:{}};}
}
function saveProgress(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));}catch{}}
const progress = loadProgress();
function sentKey(c,u,i){return c+'/'+u+'/'+i;}

// EXPORT / IMPORT
function showDataMsg(text,isError){
  const el=$('data-msg');
  el.textContent=text;
  el.classList.toggle('error',!!isError);
  clearTimeout(showDataMsg._t);
  showDataMsg._t=setTimeout(()=>{el.textContent='';},6000);
}
function exportProgress(){
  const data={
    app:'thai-master',version:3,
    exportedAt:new Date().toISOString(),
    progress:{learned:progress.learned,srs:progress.srs,days:progress.days||{}}
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='thai-master-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showDataMsg('エクスポートしました(学習済 '+Object.keys(progress.learned).length+' 件)');
}
// Newer-wins merge: an SRS entry from the file replaces the local one only if
// its lastReviewed timestamp is the same or later, so importing an old backup
// never rolls back fresher local study history.
function mergeProgress(p){
  let nl=0,ns=0;
  Object.keys(p.learned||{}).forEach(k=>{
    if(!progress.learned[k]) nl++;
    progress.learned[k]=1;
  });
  Object.keys(p.srs||{}).forEach(k=>{
    const s=p.srs[k];
    if(!s||typeof s!=='object') return;
    const cur=progress.srs[k];
    if(!cur||(+s.l||0)>=(+cur.l||0)){
      progress.srs[k]={e:+s.e||2.5,i:+s.i||0,r:+s.r||0,d:+s.d||0,l:+s.l||0};
      ns++;
    }
  });
  // 学習日ごとの回数はストリーク用 — 日付キーのみ受け入れ、大きい方を残す
  Object.keys(p.days||{}).forEach(k=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    const v=Math.floor(+p.days[k]||0);
    if(v>0) progress.days[k]=Math.max(progress.days[k]||0,v);
  });
  return {learned:nl,srs:ns};
}
function importProgressFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      const p=data.progress||data;   // accept a raw {learned,srs} object too
      if(!p||typeof p.learned!=='object'||typeof p.srs!=='object') throw new Error('format');
      const total=Object.keys(p.learned).length;
      if(!confirm('バックアップから '+total+' 件の学習記録を読み込みます。\n現在の進捗と統合します(新しい記録が優先されます)。よろしいですか?')) return;
      const r=mergeProgress(p);
      saveProgress();
      renderHome();
      showDataMsg('インポート完了:学習済 '+r.learned+' 件を追加、復習データ '+r.srs+' 件を更新しました');
    }catch(e){
      showDataMsg('読み込めませんでした。タイ語マスターでエクスポートしたJSONファイルを選択してください。',true);
    }
  };
  reader.onerror=()=>showDataMsg('ファイルを読み込めませんでした。',true);
  reader.readAsText(file);
}
function isLearned(c,u,i){return !!progress.learned[sentKey(c,u,i)];}
function setLearned(c,u,i,v){
  const k=sentKey(c,u,i);
  if(v){
    if(!progress.srs[k]) gradeSrs(c,u,i,4);
    else { progress.learned[k]=1; saveProgress(); }
  }else{
    delete progress.learned[k];
    delete progress.srs[k];
    saveProgress();
  }
}

// STATS
function getCourseStats(k){const c=COURSES[k];let t=0,l=0;c.units.forEach(u=>{t+=u.sentences.length;u.sentences.forEach((s,i)=>{if(isLearned(k,u.id,i))l++;});});return {total:t,learned:l};}
function getUnitStats(k,uid){const u=COURSES[k].units.find(x=>x.id===uid);let l=0;u.sentences.forEach((s,i)=>{if(isLearned(k,uid,i))l++;});return {total:u.sentences.length,learned:l};}
function getGlobalStats(){let t=0,l=0;Object.keys(COURSES).forEach(k=>{const s=getCourseStats(k);t+=s.total;l+=s.learned;});return {total:t,learned:l,percent:t?Math.round(l/t*100):0};}

// SRS — SM-2 (lite). State per sentence: e(ase), i(nterval days), r(eps), d(ue ms), l(astReviewed ms).
// Quality grades used by UI: 1=Again, 4=Good, 5=Easy.
const DAY_MS=86400000;
// 次回間隔(日)の計算。gradeSrsとpreviewIntervalで共用し、表示と実際のズレを防ぐ。
function nextIntervalDays(s,q){
  let i;
  if(s.r===0) i=1;
  else if(s.r===1) i=6;
  else i=Math.max(1,Math.round(s.i*s.e));
  if(q===5) i=Math.max(i+1,Math.round(i*1.3));   // easy bonus
  return i;
}
function gradeSrs(c,u,i,q){
  const k=sentKey(c,u,i);
  const now=Date.now();
  const s=progress.srs[k]||{e:2.5,i:0,r:0,d:0,l:0};
  if(q<3){
    s.r=0;s.i=0;
    s.d=now+10*60*1000;          // 10-min relearn
  }else{
    s.i=nextIntervalDays(s,q);
    s.r+=1;
    s.d=now+s.i*DAY_MS;
  }
  s.e=Math.max(1.3,s.e+(0.1-(5-q)*(0.08+(5-q)*0.02))); // SM-2 ease formula
  s.l=now;
  progress.srs[k]=s;
  if(s.r>=1) progress.learned[k]=1;
  bumpDailyActivity(now);
  saveProgress();
}
function isDue(c,u,i){const s=progress.srs[sentKey(c,u,i)];return !!s && s.d<=Date.now();}
function previewInterval(c,u,i,q){
  if(q<3) return '10分';
  const s=progress.srs[sentKey(c,u,i)]||{e:2.5,i:0,r:0,d:0,l:0};
  return nextIntervalDays(s,q)+'日';
}

// STREAK — 日別の学習回数を記録し、連続学習日数を計算する
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function bumpDailyActivity(now){
  const k=dayKey(now);
  progress.days[k]=(progress.days[k]||0)+1;
}
function getStreak(){
  let t=Date.now();
  if(!progress.days[dayKey(t)]) t-=DAY_MS;   // 今日まだ学習していなければ昨日から数える
  let n=0;
  while(progress.days[dayKey(t)]){n++;t-=DAY_MS;}
  return n;
}
function getUnitDueCount(c,uid){
  const u=COURSES[c].units.find(x=>x.id===uid);if(!u)return 0;
  let n=0;for(let i=0;i<u.sentences.length;i++) if(isDue(c,uid,i)) n++;return n;
}
function getCourseDueCount(c){let n=0;COURSES[c].units.forEach(u=>{u.sentences.forEach((_,i)=>{if(isDue(c,u.id,i))n++;});});return n;}
function getGlobalDueCount(){return Object.keys(COURSES).reduce((a,k)=>a+getCourseDueCount(k),0);}

// TTS - Chirp 3: HD MP3再生 + Web Speech APIフォールバック
let thaiVoice = null;
let audioManifest = null;
let manifestLoaded = false;
let currentAudio = null;
const AUDIO_BASE = './audio/';
const MANIFEST_URL = './audio-manifest.json';

function loadVoices(){if(!('speechSynthesis' in window))return false;const v=speechSynthesis.getVoices();if(v.length===0)return false;thaiVoice=v.find(x=>x.lang&&x.lang.toLowerCase().startsWith('th'))||null;return true;}
function initVoices(){if(!('speechSynthesis' in window))return;if(!loadVoices())speechSynthesis.onvoiceschanged=loadVoices;}

// マニフェスト読み込み(成功するまで再試行可能。force-cacheは更新が固定化されるため使わない)
async function loadManifest(){
  if(manifestLoaded) return;
  try{
    const res = await fetch(MANIFEST_URL);
    if(res.ok){
      audioManifest = await res.json();
      manifestLoaded = true;
      console.log('Audio manifest loaded:',Object.keys(audioManifest).length,'entries');
    }
  }catch(e){
    console.log('Manifest unavailable, using Web Speech API fallback');
  }
}

function stopAll(){
  if(currentAudio){
    const a=currentAudio;
    currentAudio=null;   // 先に手放す — src=''はerrorイベントを発火させるため、
    a.pause();           // 以降このaudioのイベントでフォールバック再生させない
    a.src='';
  }
  if('speechSynthesis' in window) speechSynthesis.cancel();
}

function speak(text, rate, onEnd){
  stopAll();
  
  // Chirp 3 HD MP3を優先使用
  if(audioManifest && audioManifest[text]){
    try{
      const audio = new Audio(AUDIO_BASE + audioManifest[text]);
      // rate: 0.5 = ゆっくり再生(復習用), 1.0 = ネイティブ速度
      // Chirp 3生成時は既に0.9で生成しているので、ここでさらに調整可能
      audio.playbackRate = rate ? Math.max(0.5, Math.min(2, rate / 0.85)) : 1.0;
      audio.preservesPitch = true; // 音程を維持
      currentAudio = audio;
      audio.addEventListener('ended', () => {
        if(currentAudio === audio) currentAudio = null;
        if(onEnd) onEnd();
      });
      audio.addEventListener('error', () => {
        // stopAll()で中断された古いaudioのerror — 放置しないと前の文がTTSで二重再生される
        if(currentAudio !== audio) return;
        currentAudio = null;
        // MP3失敗時はWeb Speech APIへフォールバック
        speakFallback(text, rate, onEnd);
      });
      audio.play().catch(() => {
        // pause()による中断のrejectは無視。自動再生ブロック等(現役のaudio)のみフォールバック
        if(currentAudio !== audio) return;
        speakFallback(text, rate, onEnd);
      });
      return;
    }catch(e){
      // 例外時もフォールバック
    }
  }
  
  // フォールバック: Web Speech API
  speakFallback(text, rate, onEnd);
}

function speakFallback(text, rate, onEnd){
  if(!('speechSynthesis' in window)){if(onEnd)onEnd();return;}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'th-TH';
  u.rate = rate || 0.85;
  u.pitch = 1;
  if(thaiVoice) u.voice = thaiVoice;
  u.onend = () => {if(onEnd) onEnd();};
  u.onerror = () => {if(onEnd) onEnd();};
  setTimeout(() => speechSynthesis.speak(u), 30);
}

function showVoiceNotice(el){
  // Chirp 3 HD音声があれば通知不要
  if(audioManifest){el.innerHTML='';return;}
  if(!('speechSynthesis' in window)){
    el.innerHTML='<div class="notice">この端末は音声に対応していません。テキスト学習のみご利用いただけます。</div>';
    return;
  }
  setTimeout(()=>{
    if(audioManifest){el.innerHTML='';return;}
    if(!thaiVoice){
      el.innerHTML='<div class="notice">高品質音声(Chirp 3 HD)を読み込み中...または、お使いの端末にタイ語音声がない場合はテキストのみで学習できます。</div>';
    }else{
      el.innerHTML='';
    }
  },800);
}

// AUDIO BULK DOWNLOAD — コース単位で音声を先読みし、オフライン再生を可能にする。
// ページからのfetchはSWのcache-firstを通るため、取得と同時にAUDIO_CACHEへ保存される。
let audioDlToken=0;
function collectCourseAudioUrls(courseKey){
  if(!audioManifest||!COURSES[courseKey]) return [];
  const urls=new Set();
  COURSES[courseKey].units.forEach(u=>{
    u.sentences.forEach(s=>{
      if(audioManifest[s.th]) urls.add(AUDIO_BASE+audioManifest[s.th]);
      (s.words||[]).forEach(w=>{ if(audioManifest[w.th]) urls.add(AUDIO_BASE+audioManifest[w.th]); });
    });
  });
  return [...urls];
}
function setAudioDlMsg(text,isError){
  const el=$('audio-dl-msg');
  el.textContent=text||'';
  el.classList.toggle('error',!!isError);
}
function resetAudioDlUi(courseKey){
  audioDlToken++;   // 進行中の保存があってもUI更新を無効化(fetch自体は継続して無駄にならない)
  const n=collectCourseAudioUrls(courseKey).length;
  $('course-audio-btn').disabled=false;
  $('audio-dl-label').textContent = n
    ? `音声をオフライン保存(${n}件・約${Math.max(1,Math.round(n*0.0097))}MB)`
    : '音声をオフライン保存';
  setAudioDlMsg('');
}
async function downloadCourseAudio(courseKey){
  const token=++audioDlToken;
  const live=()=>token===audioDlToken;   // 別コースを開いたら以降このrunはUIに触らない
  const btn=$('course-audio-btn');
  await loadManifest();
  if(!audioManifest){ if(live()) setAudioDlMsg('音声リストを取得できませんでした。通信環境をご確認ください。',true); return; }
  const urls=collectCourseAudioUrls(courseKey);
  if(urls.length===0){ if(live()) setAudioDlMsg('このコースに保存できる音声はありません(端末の音声合成を使用します)。',true); return; }
  btn.disabled=true;
  const total=urls.length;
  let done=0,failed=0;
  const queue=urls.slice();
  const setLabel=t=>{ if(live()) $('audio-dl-label').textContent=t; };
  setLabel(`保存中… 0 / ${total}`);
  const worker=async()=>{
    while(queue.length){
      const url=queue.shift();
      try{
        const hit=('caches' in window)?await caches.match(url):null;   // 保存済みはスキップ
        if(!hit){
          const res=await fetch(url);
          if(!res.ok) failed++;
        }
      }catch{ failed++; }
      done++;
      if(done%20===0||done===total) setLabel(`保存中… ${done} / ${total}`);
    }
  };
  await Promise.all(Array.from({length:6},worker));
  if(!live()) return;
  btn.disabled=false;
  if(failed===0){
    setLabel('音声を保存済み(タップで再確認)');
    setAudioDlMsg(`${total} 件の音声を保存しました。オフラインでも再生できます。`);
  }else{
    setLabel('音声をオフライン保存(再試行)');
    setAudioDlMsg(`${total-failed} / ${total} 件を保存しました。残りは通信環境の良い場所で再試行してください。`,true);
  }
}

// UTIL
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}

const currentItem = () => getCardDeck()[state.cardIdx];   // {s, c, u, i}

// Audio + visual highlight helpers
function clearPlaying(root){ $$('.playing', root).forEach(x => x.classList.remove('playing')); }
function playWithHighlight(el, text, rate){
  el.classList.add('playing');
  speak(text, rate, () => setTimeout(() => el.classList.remove('playing'), 100));
}

      `<button class="review-cta" id="review-cta-btn">`+

    card.innerHTML=
      `<div class="course-head">`+

        `<div class="course-num">${String(i+1).padStart(2,'0')} / ${totalLabel}</div>`+
      `</div>`+

function openCourse(key){
  state.course=key;const c=COURSES[key];
  $('units-title').textContent=c.title;
  $('units-thai-title').textContent=c.thaiTitle;
  $('banner-label').textContent=c.subtitle;
  $('banner-title').textContent=c.title;
  $('banner-thai').textContent=c.thaiTitle;
  const s=getCourseStats(key);
  $('units-meta').textContent=s.learned+' / '+s.total;
  resetAudioDlUi(key);
  const list=$('unit-list');list.innerHTML='';
  c.units.forEach((u,i)=>{
    const us=getUnitStats(key,u.id);const p=us.total?Math.round(us.learned/us.total*100):0;
    const due=getUnitDueCount(key,u.id);
    const dueHtml=due>0?`<div class="due-badge">復習 ${due}</div>`:'';
    const card=document.createElement('button');card.className='unit-card';
    card.innerHTML=
      `<div class="unit-num">${String(i+1).padStart(2,'0')}</div>`+
      `<div class="unit-info"><div class="unit-title">${escapeHtml(u.title)}</div><div class="unit-thai">${escapeHtml(u.thaiTitle)}</div></div>`+
      `<div class="unit-meta"><div class="unit-count">${us.learned} / ${us.total}</div><div class="unit-progress"><div class="unit-progress-fill ${p===100?'complete':''}" style="width:${p}%"></div></div>${dueHtml}</div>`;

    list.appendChild(card);
  });
  showScreen('units');
}

function openUnit(uid){
  endGlobalReview();
  state.unit=uid;state.mode='list';state.cardIdx=0;state.cardFlipped=false;state.quiz=null;state.reviewQueue=null;
  const u=currentUnit();
  $('study-title').textContent=u.title;
  $('study-thai-title').textContent=u.thaiTitle;
  $$('.mode-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector('.mode-tab[data-mode="list"]').classList.add('active');
  if(state.course==='script' && state.unit!=='s09'){
    // Letter names are not in the HD audio manifest — they play via the device's Thai TTS voice.
    $('notice-area').innerHTML='<div class="notice">文字の読み上げは端末のタイ語音声(音声合成)を使用します。端末にタイ語音声がない場合は音が出ないことがあります。</div>';
  }else{
    showVoiceNotice($('notice-area'));
  }
  showMode('list');
  showScreen('study');
}

const FLASHCARD_TEMPLATE =
  `<span class="fc-num" id="fc-num">01</span>`+
  `<span class="fc-side" id="fc-side">FRONT</span>`+
  `<div class="fc-thai" id="fc-thai">—</div>`+
  `<div class="fc-ph" id="fc-ph">—</div>`+
  `<div class="fc-jp fc-hidden" id="fc-jp">—</div>`+
  `<div class="fc-hint" id="fc-hint">タップで意味を見る</div>`;

function showMode(m){
  state.mode=m;
  const isCardLike=(m==='card'||m==='review');
  $('sentence-list').style.display = m==='list' ? 'block' : 'none';
  $('card-area').style.display     = isCardLike ? 'flex'  : 'none';
  $('quiz-area').style.display     = m==='quiz' ? 'block' : 'none';
  window.scrollTo(0,0);
  if(m==='list'){state.reviewQueue=null;renderList();}
  else if(isCardLike){
    state.cardIdx=0;state.cardFlipped=false;state.completed=false;
    if(m==='review'){
      const u=currentUnit();
      state.reviewQueue=[];
      u.sentences.forEach((s,i)=>{ if(isDue(state.course,state.unit,i)) state.reviewQueue.push(i); });
    } else {
      state.reviewQueue=null;
    }
    $('flashcard').innerHTML=FLASHCARD_TEMPLATE;
    $('flashcard').style.cursor='pointer';
    if(state.reviewQueue && state.reviewQueue.length===0) renderReviewEmpty();
    else renderCard();
  }
  else if(m==='quiz'){state.reviewQueue=null;startQuiz();}
}

function getCardDeck(){
  if(state.globalQueue) return state.globalQueue;
  const u=currentUnit();
  if(state.reviewQueue) return state.reviewQueue.map(i=>({s:u.sentences[i], c:state.course, u:state.unit, i}));
  return u.sentences.map((s,i)=>({s, c:state.course, u:state.unit, i}));
}

// GLOBAL REVIEW — all due cards across every course/unit, oldest due first
function getAllDueItems(){
  const items=[];
  Object.keys(COURSES).forEach(c=>{
    COURSES[c].units.forEach(u=>{
      u.sentences.forEach((s,i)=>{
        if(isDue(c,u.id,i)) items.push({s, c, u:u.id, i, unitTitle:u.title, due:progress.srs[sentKey(c,u.id,i)].d});
      });
    });
  });
  items.sort((a,b)=>a.due-b.due);
  return items;
}
function startGlobalReview(){
  const q=getAllDueItems();
  if(q.length===0) return;
  state.course=null;state.unit=null;state.quiz=null;state.reviewQueue=null;
  state.globalQueue=q;state.mode='review';state.cardIdx=0;state.cardFlipped=false;state.completed=false;
  $('study-title').textContent='今日の復習';
  $('study-thai-title').textContent='ทบทวนวันนี้';
  document.querySelector('.mode-tabs').style.display='none';
  showVoiceNotice($('notice-area'));
  $('sentence-list').style.display='none';
  $('card-area').style.display='flex';
  $('quiz-area').style.display='none';
  $('flashcard').innerHTML=FLASHCARD_TEMPLATE;
  $('flashcard').style.cursor='pointer';
  showScreen('study');
  renderCard();
}
function endGlobalReview(){
  state.globalQueue=null;
  document.querySelector('.mode-tabs').style.display='';
}

// LIST
function buildVocabHtml(s, sentIdx){
  if(!s.words || s.words.length===0) return {toggle:'', list:''};
  const items = s.words.map((w,wi)=>(
    `<div class="vocab-item"><div class="vocab-th" data-sidx="${sentIdx}" data-widx="${wi}">${escapeHtml(w.th)}</div><div class="vocab-ph">${escapeHtml(w.ph)}</div><div class="vocab-jp">${escapeHtml(w.jp)}</div></div>`
  )).join('');
  return {
    toggle: `<button class="vocab-toggle" data-idx="${sentIdx}"><span>新出語 ${s.words.length} 語 (vocabulary)</span><span class="arrow">▶</span></button>`,
    list:   `<div class="vocab-list" id="vocab-${sentIdx}">${items}</div>`
  };
}
function renderList(){
  const u=currentUnit();
  const stats=getUnitStats(state.course,state.unit);
  $('study-counter').textContent=stats.learned+' / '+stats.total;
  $('study-meta').textContent=u.thaiTitle;
  const w=$('sentence-list');w.innerHTML='';
  if(u.note){
    const n=document.createElement('div');
    n.className='notice';n.style.margin='0 0 14px';
    n.textContent=u.note;
    w.appendChild(n);
  }
  u.sentences.forEach((s,i)=>{
    const learned=isLearned(state.course,state.unit,i);
    const {toggle, list}=buildVocabHtml(s,i);
    const togglePart = toggle ? `<div style="flex:1">${toggle}</div>` : '';
    const card=document.createElement('div');card.className='sentence-card';
    card.innerHTML=
      `<div class="num">№ ${String(i+1).padStart(3,'0')}</div>`+
      `<div class="sent-thai" data-idx="${i}">${escapeHtml(s.th)}${ICONS.speaker}</div>`+
      `<div class="sent-ph">${escapeHtml(s.ph)}</div>`+
      `<div class="sent-jp">${escapeHtml(s.jp)}</div>`+
      `<div class="sent-actions">`+
        `<button class="icon-btn slow" data-action="slow" data-idx="${i}" aria-label="ゆっくり再生">${ICONS.clock}</button>`+
        `<button class="icon-btn learned ${learned?'active':''}" data-action="learned" data-idx="${i}" aria-label="学習済みを切替">${ICONS.check}</button>`+
        togglePart+
      `</div>`+
      list;
    w.appendChild(card);
  });

  $$('.sent-thai',w).forEach(el=>{
    el.addEventListener('click',()=>{
      const i=+el.dataset.idx;
      clearPlaying(w);
      playWithHighlight(el, u.sentences[i].th, 0.8);
    });
  });
  $$('.icon-btn',w).forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      e.stopPropagation();
      const i=+btn.dataset.idx;const a=btn.dataset.action;
      if(a==='slow'){
        clearPlaying(w);
        const t=btn.closest('.sentence-card').querySelector('.sent-thai');
        playWithHighlight(t, u.sentences[i].th, 0.5);
      }else if(a==='learned'){
        const v=!isLearned(state.course,state.unit,i);
        setLearned(state.course,state.unit,i,v);
        btn.classList.toggle('active',v);
        const s2=getUnitStats(state.course,state.unit);
        $('study-counter').textContent=s2.learned+' / '+s2.total;
      }
    });
  });
  $$('.vocab-toggle',w).forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      e.stopPropagation();
      const i=+btn.dataset.idx;
      btn.classList.toggle('active');
      $('vocab-'+i).classList.toggle('show');
    });
  });
  $$('.vocab-th',w).forEach(el=>{
    el.addEventListener('click',(e)=>{
      e.stopPropagation();
      const sidx=+el.dataset.sidx, widx=+el.dataset.widx;
      const word=u.sentences[sidx].words[widx];
      clearPlaying(w);
      playWithHighlight(el, word.th, 0.7);
    });
  });
}

// CARD
function renderCard(){
  const deck=getCardDeck();
  if(deck.length===0){renderReviewEmpty();return;}
  const item=deck[state.cardIdx];const s=item.s;
  $('study-counter').textContent=(state.cardIdx+1)+' / '+deck.length;
  $('study-meta').textContent=state.globalQueue ? (item.unitTitle||'') : currentUnit().thaiTitle;
  $('fc-num').textContent='№ '+String(state.cardIdx+1).padStart(3,'0');
  $('fc-side').textContent=state.cardFlipped?'BACK':'FRONT';
  $('fc-thai').textContent=s.th;
  $('fc-ph').textContent=s.ph;
  const j=$('fc-jp');j.textContent=s.jp;j.classList.toggle('fc-hidden',!state.cardFlipped);
  $('fc-hint').textContent=state.cardFlipped?'評価して次のカードへ':'タップで意味を見る';
  renderCardControls(item);
  playWithHighlight($('fc-thai'), s.th, 0.8);
}
function renderCardControls(item){
  const ctrls=$('fc-controls');
  if(!state.cardFlipped){
    ctrls.className='fc-controls';
    const prevDim=state.cardIdx===0;
    ctrls.innerHTML=
      `<button class="fc-btn prev" id="fc-prev" aria-label="前のカード"${prevDim?' style="opacity:.3;pointer-events:none"':''}>${ICONS.back}前へ</button>`+
      `<button class="fc-btn next" id="fc-reveal">答えを見る${ICONS.forward}</button>`;
    $('fc-prev').addEventListener('click',(e)=>{e.stopPropagation();prevCard();});
    $('fc-reveal').addEventListener('click',(e)=>{e.stopPropagation();flipCard();});
  }else{
    ctrls.className='fc-grade-controls';
    const {c,u,i}=item;
    const lA=previewInterval(c,u,i,1);
    const lG=previewInterval(c,u,i,4);
    const lE=previewInterval(c,u,i,5);
    ctrls.innerHTML=
      `<button class="fc-grade-btn again" data-q="1"><span class="label">もう一度</span><span class="interval">${lA}</span></button>`+
      `<button class="fc-grade-btn good"  data-q="4"><span class="label">正解</span><span class="interval">${lG}</span></button>`+
      `<button class="fc-grade-btn easy"  data-q="5"><span class="label">簡単</span><span class="interval">${lE}</span></button>`;
    $$('.fc-grade-btn',ctrls).forEach(btn=>{
      btn.addEventListener('click',(e)=>{
        e.stopPropagation();
        const q=+btn.dataset.q;
        gradeSrs(c,u,i,q);
        if(q===1) requeueCurrent(item);   // 「もう一度」はセッション末尾に再出題
        advanceCard();
      });
    });
  }
}
function flipCard(){if(state.completed)return;state.cardFlipped=!state.cardFlipped;renderCard();}
// 「もう一度」のカードを復習キュー末尾へ戻す(全て正解になるまでセッションが終わらない)。
// 通常カードモードはデッキを都度導出するため対象外 — 復習モードのみ。
function requeueCurrent(item){
  if(state.globalQueue) state.globalQueue.push(item);
  else if(state.reviewQueue) state.reviewQueue.push(item.i);
}
function advanceCard(){
  const deck=getCardDeck();
  if(state.cardIdx<deck.length-1){state.cardIdx++;state.cardFlipped=false;renderCard();}
  else cardComplete();
}
function prevCard(){if(state.cardIdx>0){state.cardIdx--;state.cardFlipped=false;renderCard();}}

function showCompletionScreen({title, thai, desc}){
  state.completed=true;   // 完了画面表示中はタップ/Enterでのめくり直しを無効化
  $('flashcard').style.cursor='default';
  $('flashcard').innerHTML=
    `<div class="completion-screen"><div class="symbol">๏</div>`+
    `<div class="title">${title}</div>`+
    `<div class="thai">${thai}</div>`+
    `<div class="desc">${desc}</div></div>`;
  $('fc-controls').innerHTML='';
}
function cardComplete(){
  if(state.globalQueue){
    showCompletionScreen({
      title: '今日の復習を完了しました',
      thai:  'ทบทวนเสร็จแล้ว',
      desc:  '本日の復習対象をすべて完了しました。<br>おつかれさまでした。'
    });
    return;
  }
  const isReview=!!state.reviewQueue;
  showCompletionScreen({
    title: isReview ? '復習を完了しました' : '完了しました',
    thai:  isReview ? 'ทบทวนเสร็จแล้ว' : 'เสร็จสิ้น',
    desc:  isReview
      ? '今回の復習対象を全て完了しました。<br>ホームに戻るか、別のユニットへ進みましょう。'
      : 'このユニットの全文を確認しました。<br>クイズで定着度を確かめましょう。'
  });
}
function renderReviewEmpty(){
  $('study-counter').textContent='0 / 0';
  showCompletionScreen({
    title: '復習はありません',
    thai:  'ไม่มีอะไรต้องทบทวน',
    desc:  'このユニットには現在<br>復習対象の文がありません。<br>カードや一覧で新しい文を学習しましょう。'
  });
}

// QUIZ
function startQuiz(){
  const u=currentUnit();
  const all=u.sentences.map((s,idx)=>({s,idx}));
  const qs=shuffle(all).slice(0,Math.min(10,all.length));
  state.quiz={questions:qs,pool:all,current:0,correct:0,answers:[],answered:false,direction:'th2jp'};
  renderQuizQ();
}
function renderQuizQ(){
  const q=state.quiz;
  if(q.current>=q.questions.length){renderQuizResult();return;}
  $('study-counter').textContent=(q.current+1)+' / '+q.questions.length;
  const cur=q.questions[q.current];const sent=cur.s;
  // リスニング問題は音が出せる場合のみ出題(HD音声または端末TTS)
  const canListen=!!(audioManifest&&audioManifest[sent.th])||('speechSynthesis' in window);
  const dirs=canListen?['th2jp','jp2th','listen']:['th2jp','jp2th'];
  q.direction=dirs[Math.floor(Math.random()*dirs.length)];
  const distract=shuffle(q.pool.filter(x=>x.idx!==cur.idx)).slice(0,3);
  const opts=shuffle([cur,...distract]);

  // Progress pips
  let pips='<div class="quiz-progress">';
  for(let i=0;i<q.questions.length;i++){
    let cls='';
    if(i<q.current) cls=q.answers[i]==='correct'?'done':'wrong';
    else if(i===q.current) cls='current';
    pips+=`<div class="pip ${cls}"></div>`;
  }
  pips+='</div>';

  // Question card
  let qh;
  if(q.direction==='th2jp'){
    qh=`<div class="quiz-question"><div class="quiz-prompt">タイ語 → 日本語</div><div class="quiz-thai" id="quiz-thai">${escapeHtml(sent.th)}</div><div class="quiz-ph-small">${escapeHtml(sent.ph)}</div></div>`;
  }else if(q.direction==='jp2th'){
    qh=`<div class="quiz-question"><div class="quiz-prompt">日本語 → タイ語</div><div class="quiz-jp">${escapeHtml(sent.jp)}</div></div>`;
  }else{
    // listen: タイ語表記は隠して音声だけで出題。答え合わせ時に開示する
    qh=`<div class="quiz-question"><div class="quiz-prompt">音声 → 日本語</div>`+
       `<button class="quiz-listen-btn" id="quiz-listen" aria-label="音声を再生">${ICONS.speakerLg}</button>`+
       `<div class="quiz-thai quiz-reveal-hidden" id="quiz-thai">${escapeHtml(sent.th)}</div>`+
       `<div class="quiz-ph-small quiz-reveal-hidden" id="quiz-ph-reveal">${escapeHtml(sent.ph)}</div></div>`;
  }

  // Options
  const optsHtml = opts.map(o=>{
    const correct = o.idx===cur.idx ? '1' : '0';
    return q.direction==='jp2th'
      ? `<button class="quiz-option" data-correct="${correct}"><div class="opt-thai">${escapeHtml(o.s.th)}</div><div class="opt-ph">${escapeHtml(o.s.ph)}</div></button>`
      : `<button class="quiz-option" data-correct="${correct}"><div class="opt-jp">${escapeHtml(o.s.jp)}</div></button>`;
  }).join('');
  const oh = `<div class="quiz-options">${optsHtml}</div><button class="quiz-next-btn" id="quiz-next-btn">次の問題へ</button>`;

  $('quiz-area').innerHTML = pips+qh+oh;

  if(q.direction==='th2jp'){
    const t=$('quiz-thai');
    t.addEventListener('click',()=>playWithHighlight(t, sent.th, 0.75));
    setTimeout(()=>playWithHighlight(t, sent.th, 0.8), 200);
  }else if(q.direction==='listen'){
    const b=$('quiz-listen');
    b.addEventListener('click',()=>playWithHighlight(b, sent.th, 0.8));
    setTimeout(()=>playWithHighlight(b, sent.th, 0.8), 200);
  }
  q.answered=false;
  $$('.quiz-option').forEach(opt=>{
    opt.addEventListener('click',()=>{
      if(q.answered) return; q.answered=true;
      const correct = opt.dataset.correct==='1';
      $$('.quiz-option').forEach(o=>{o.classList.add('disabled'); if(o.dataset.correct==='1') o.classList.add('correct');});
      if(!correct) opt.classList.add('wrong');
      if(q.direction==='jp2th') speak(sent.th, 0.75);
      if(q.direction==='listen'){
        // 答え合わせ時にタイ語表記を開示し、もう一度聞かせて音と文字を結び付ける
        $('quiz-thai').classList.remove('quiz-reveal-hidden');
        $('quiz-ph-reveal').classList.remove('quiz-reveal-hidden');
        const t=$('quiz-thai');
        t.addEventListener('click',()=>playWithHighlight(t, sent.th, 0.75));
        speak(sent.th, 0.75);
      }
      if(correct){ q.correct++; q.answers.push('correct'); gradeSrs(state.course,state.unit,cur.idx,4); }
      else      { q.answers.push('wrong');   gradeSrs(state.course,state.unit,cur.idx,1); }
      $('quiz-next-btn').classList.add('show');
    });
  });
  $('quiz-next-btn').addEventListener('click',()=>{state.quiz.current++;renderQuizQ();});
}
function renderQuizResult(){
  const q=state.quiz;const t=q.questions.length;const c=q.correct;const p=Math.round(c/t*100);
  let title,thai,m;
  if     (p===100){title='完璧です';     thai='ยอดเยี่ยมมาก'; m='๛';}
  else if(p>=80) {title='すばらしい';   thai='เก่งมาก';     m='๏';}
  else if(p>=60) {title='よくできました'; thai='ดีมาก';       m='๏';}
  else if(p>=40) {title='もう一歩';      thai='ลองอีกครั้ง';  m='๏';}
  else           {title='練習しましょう'; thai='ฝึกฝนต่อไป'; m='๏';}
  $('quiz-area').innerHTML=
    `<div class="quiz-result">`+
      `<div class="quiz-result-emoji">${m}</div>`+
      `<div class="quiz-result-title">${title}</div>`+
      `<div class="quiz-result-thai">${thai}</div>`+
      `<div class="quiz-result-score">${c} / ${t}</div>`+
      `<div class="quiz-result-detail">正答率 ${p}%</div>`+
      `<div class="quiz-result-actions">`+
        `<button class="retry" id="quiz-retry">もう一度</button>`+
        `<button class="next" id="quiz-back">レッスンへ戻る</button>`+
      `</div></div>`;
  $('quiz-retry').addEventListener('click',()=>startQuiz());
  $('quiz-back').addEventListener('click',()=>document.querySelector('.mode-tab[data-mode="list"]').click());
  const s2=getUnitStats(state.course,state.unit);
  $('study-counter').textContent=s2.learned+' / '+s2.total;
}

// EVENTS
$$('.back-btn').forEach(b=>b.addEventListener('click',()=>{
  const t=b.dataset.back;
  if(t==='home'){renderHome();showScreen('home');}
  else if(t==='units'){
    // Global review is entered from home, so back returns there.
    if(state.globalQueue||!state.course){endGlobalReview();renderHome();showScreen('home');}
    else openCourse(state.course);
  }
}));
$$('.mode-tab').forEach(t=>t.addEventListener('click',()=>{
  $$('.mode-tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');showMode(t.dataset.mode);
}));
$('flashcard').addEventListener('click',(e)=>{
  if(e.target.id==='fc-thai'){
    // Use the current deck item — in review mode state.cardIdx indexes the queue, not u.sentences.
    const item=currentItem();
    if(!item) return;
    playWithHighlight(e.target, item.s.th, 0.75);
    return;
  }
  flipCard();
});
$('flashcard').addEventListener('keydown',(e)=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  e.preventDefault();
  flipCard();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll();});
$('course-audio-btn').addEventListener('click',()=>{ if(state.course) downloadCourseAudio(state.course); });
$('export-btn').addEventListener('click',exportProgress);
$('import-btn').addEventListener('click',()=>$('import-file').click());
$('import-file').addEventListener('change',(e)=>{
  const f=e.target.files[0];
  if(f) importProgressFile(f);
  e.target.value='';   // allow re-selecting the same file
});

// INIT
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
initVoices();
loadManifest();  // Chirp 3 HD MP3マニフェストを読み込み
loadCourses().then(renderHome).catch(err=>{
  console.error('Failed to load courses:',err);
  const list=$('course-list');
  if(list) list.innerHTML='<div class="notice">コースデータを読み込めませんでした。ページを再読み込みしてください。</div>';
});

// PWA — service worker registration
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./service-worker.js')
    .then(reg=>console.log('SW registered, scope:',reg.scope))
    .catch(err=>console.log('SW registration failed:',err));
}
</script>
